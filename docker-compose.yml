name: mova

services:
  db:
    image: postgis/postgis:15-3.3
    container_name: mova_pt_db
    restart: always
    environment:
      - POSTGRES_USER=admin
      - POSTGRES_PASSWORD=test123
      - POSTGRES_DB=stm
    ports:
      - '5432:5432'
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -h 127.0.0.1 -U admin -d stm']
      interval: 2s
      retries: 30

  redis:
    image: redis:7-alpine
    container_name: mova_pt_redis
    restart: always
    ports:
      - '6379:6379'
    volumes:
      - redis_data:/data
    command: redis-server --save 60 1 --loglevel warning

volumes:
  postgres_data:
  redis_data:
