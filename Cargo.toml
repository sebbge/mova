[workspace]
members = ["lib/core", "lib/server", "lib/providers/*"]
resolver = "3"

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.88"
publish = false

[workspace.dependencies]
citymob-core = { path = "lib/core" }
citymob-stm = { path = "lib/providers/stm" }

async-trait = "0.1.92"
axum = "0.8.9"
chrono = { version = "0.4.45", features = ["serde"] }
dotenvy = "0.15.7"
futures-util = { version = "0.3.34", default-features = false }
gtfs-structures = { version = "0.50.1", default-features = false }
redis = { version = "1.7.0", features = ["tokio-comp"] }
reqwest = { version = "0.13.5", default-features = false, features = [
    "json",
    "form",
    "charset",
    "system-proxy",
    "rustls-no-provider",
] }
rustls = { version = "0.23.45", default-features = false, features = [
    "ring",
    "std",
    "tls12",
    "logging",
] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
serde_with = "3.23.0"
sqlx = { version = "0.9.0", features = [
    "runtime-tokio",
    "postgres",
    "chrono",
    "migrate",
] }
tokio = { version = "1.53.1", features = [
    "macros",
    "net",
    "rt-multi-thread",
    "sync",
    "time",
] }
tower-http = { version = "0.7.1", features = ["cors", "trace"] }
tracing = "0.1.44"
tracing-subscriber = "0.3.23"

[profile.dev]
opt-level = 0
incremental = true
debug = true

[profile.dev.package."*"]
opt-level = 2
debug = false

[profile.release]
opt-level = "z"
lto = true
codegen-units = 1
strip = true
panic = "abort"
