name: mova

x-logging: &logging
  driver: json-file
  options:
    max-size: 10m
    max-file: '3'

services:
  db:
    image: postgis/postgis:17-3.5
    restart: unless-stopped
    environment:
      POSTGRES_USER: bondi
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?}
      POSTGRES_DB: bondi
      TZ: America/Montevideo
    command: postgres -c shared_buffers=512MB -c effective_cache_size=2GB -c maintenance_work_mem=256MB
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U bondi -d bondi']
      interval: 5s
      retries: 30
    logging: *logging

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: redis-server --save '' --appendonly no --maxmemory 128mb --maxmemory-policy allkeys-lru --loglevel warning
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 5s
      retries: 30
    logging: *logging

  server:
    image: ghcr.io/sebbge/mova-server:${TAG:-latest}
    restart: unless-stopped
    env_file: .env
    environment:
      DATABASE_URL: postgres://bondi:${POSTGRES_PASSWORD}@db:5432/bondi
      REDIS_URL: redis://redis:6379
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    mem_limit: 2g
    networks:
      default:
      edge:
        aliases: [mova]
    logging: *logging

networks:
  edge:
    external: true

volumes:
  postgres_data:
